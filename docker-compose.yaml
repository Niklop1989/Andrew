version: "3.9"

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: insure
      POSTGRES_USER: insure
      POSTGRES_PASSWORD: insure
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Хелсчек, чтобы Django знал, когда база РЕАЛЬНО готова принимать подключения
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insure -d insure"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    # Исправлено: Добавлен флаг --insecure для работы статики при DEBUG=False
    command:
      - "python"
      - "manage.py"
      - "runserver"
      - "0.0.0.0:8080"
      - "--insecure" 
    ports:
      - "8080:8080"
    volumes:
      - ./mysite:/app
    depends_on:
      db:
        condition: service_healthy # Ждем полной готовности Postgres
    environment:
      - DATABASE_HOST=db
      - DJANGO_ALLOWED_HOSTS=83.217.223.6,127.0.0.1,localhost # На всякий случай явно передаем хосты

volumes:
  pgdata:
