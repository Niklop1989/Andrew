{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="{% static 'shopapp/css/create_product.css' %}"
    />
  </head>

  <body>
    <div class="product-create-container">
      <header class="product-create-header">
        <h1>Create a new product</h1>
      </header>

      <div class="product-create-card">
        <form method="post" class="product-form">
          {% csrf_token %}
          <div class="form-fields">{{ form.as_p }}</div>
          <button type="submit" class="btn btn-submit">Create</button>
        </form>
      </div>

      <div class="product-actions">
        <a href="{% url 'shopapp:orders_list_url' %}" class="btn btn-secondary"
          >Orders list</a
        >
      </div>

      {% if request.POST %}
      <div class="previous-data-card">
        <h2>Previous form data</h2>
        <table class="data-table">
          <tr>
            <th>delivery_address:</th>
            <td>{{ request.POST.delivery_address }}</td>
          </tr>
          <tr>
            <th>promocode:</th>
            <td>{{ request.POST.promocode }}</td>
          </tr>
          <tr>
            <th>user:</th>
            <td>{{ request.POST.user }}</td>
          </tr>
        </table>
        <div class="product-actions" style="margin-top: 1.5rem">
          <a
            href="{% url 'shopapp:orders_list_url' %}"
            class="btn btn-secondary"
            >Orders list</a
          >
        </div>
      </div>
      {% endif %}
    </div>
  </body>
</html>
