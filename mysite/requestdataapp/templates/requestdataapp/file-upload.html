{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка файла</title>
    <!-- Подключение стилей (замените путь, если используете статику Django) -->
    <link rel="stylesheet" href="{% static 'requestdataapp/css/upload.css' %}" />

</head>

<body>

    <div class="form-container">
        <h2>Загрузка документа</h2>

        <form method="post" enctype="multipart/form-data" class="responsive-form">
            {% csrf_token %}

            <div class="form-fields">
                {{ form.as_p }}
            </div>

            <button type="submit" class="btn-submit">Загрузить файл</button>
        </form>
    </div>

</body>

</html>
